
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konfirmasi Pesanan - ARSANMARKET</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0a12;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .confirm-box {
      width: 100%;
      max-width: 430px;
      background: #171525;
      border: 1px solid #39334f;
      border-radius: 20px;
      padding: 28px;
      text-align: center;
    }

    h1 {
      color: #b69aff;
    }

    p {
      color: #c4c0d0;
      line-height: 1.7;
    }

    a {
      display: block;
      background: #25d366;
      color: #07150c;
      text-decoration: none;
      padding: 16px;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 24px;
    }
  </style>
</head>
<body>

<div class="confirm-box">
  <h1>ARSANMARKET.</h1>
  <h2>Menghubungkan ke WhatsApp...</h2>
  <p>Pesanan kamu sedang disiapkan.</p>
  <p>Jika WhatsApp tidak terbuka otomatis, tekan tombol di bawah.</p>
  <a id="whatsapp-link" href="#">Buka WhatsApp</a>
</div>

<script src="products.js"></script>
<script src="cart.js"></script>

<script>
const adminWhatsApp = "6282241739861";

const orderCode =
  localStorage.getItem("arsan_order_code") || "ARS-000000";

const buyerName =
  localStorage.getItem("buyer_name") || "Belum diisi";

const paymentMethod =
  localStorage.getItem("arsan_payment_method") || "Belum dipilih";

let productText = "";
let total = 0;

if (typeof cart !== "undefined" && cart.length > 0) {
  for (let i = 0; i < cart.length; i++) {
    const item = cart[i];

    productText +=
      "- " + item.name +
      " x" + item.quantity + "\n";

    total += item.price * item.quantity;
  }
} else {
  productText = "Tidak ada produk";
}

const message =
  "Halo ARSANMARKET, saya ingin konfirmasi pesanan.\n\n" +
  "Kode Pesanan: " + orderCode + "\n" +
  "Nama: " + buyerName + "\n" +
  "Produk:\n" + productText +
  "Total: " + formatRupiah(total) + "\n" +
  "Metode Pembayaran: " + paymentMethod +
  "\n\nSaya sudah melakukan payment dan ingin take data akun.";

const whatsappURL =
  "https://wa.me/" + adminWhatsApp +
  "?text=" + encodeURIComponent(message);

document.getElementById("whatsapp-link").href = whatsappURL;

window.location.replace(whatsappURL);
</script>

</body>
</html>
